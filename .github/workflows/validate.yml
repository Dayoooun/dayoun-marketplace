name: Validate open skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt pillow opencv-python pymupdf numpy python-pptx
      - name: Validate authored contracts
        run: python scripts/validate_contracts.py contracts
      - name: Check generated course kit
        run: python scripts/generate_course.py --check
      - name: Check internal course exclusions
        run: python scripts/check_generated.py --forbid-internal
      - name: Validate release fixture matrix
        run: python scripts/validate_release_fixtures.py --require-ppt-modes scene-deck,image-first --require-ocr-association R04-I,R07-I --require-original-oracle-negatives --strict
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Build non-release health artifacts
        run: python scripts/build_release_artifacts.py --all --health-only --output-dir dist/health
      - name: Prove live-class rehearsal reproducibility
        run: |
          python scripts/build_release_artifacts.py --target business-plan-writer --health-only --output-dir dist/rehearsal-ci
          python scripts/rehearse_live_class.py \
            --artifact dist/rehearsal-ci/dayoun-business-plan-writer-0.12.4.zip \
            --demo-inputs tests/course/fixtures/live-class/inputs \
            --template tests/course/fixtures/live-class/template.hwpx \
            --out dist/rehearsal-ci/evidence
